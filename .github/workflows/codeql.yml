name: CodeQL

# バックログ B-07: SAST（静的解析によるセキュリティスキャン）
# 注意: privateリポジトリでCodeQLを実行するには GitHub Advanced Security の有効化が必要。
# 未有効の場合はこのワークフローは失敗する（別途リポジトリ設定でのGHAS有効化が必要）。

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
